<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>江城游记 · 可玩城市版 — 武汉多层交互地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#F4E8D0;--bg2:#EDE0C2;--card-bg:rgba(255,252,242,.94);
  --text-main:#3C2F28;--text-muted:#8A7356;--text-faint:#B8A57E;
  --gold:#B8860B;--gold-light:#D4AF37;--green:#5B8C5A;--red:#8B0000;
  --border-dim:rgba(184,134,11,.28);--shadow:0 6px 22px rgba(60,47,40,.16);
  --accent:#8B6914;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%}
body{
  font-family:'STKaiti','KaiTi','Songti SC','SimSun',serif;
  background:linear-gradient(160deg,#F9F1DC 0%,#EFE2C3 45%,#E4D3AC 100%);
  color:var(--text-main);overflow:hidden;
}
/* ---------------- 顶部 ---------------- */
.header{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 12px;background:var(--card-bg);
  border-bottom:2px solid var(--border-dim);box-shadow:var(--shadow);
}
.header-left{display:flex;align-items:baseline;gap:8px;min-width:0}
.header-left h1{font-size:20px;letter-spacing:3px;color:var(--text-main);white-space:nowrap}
.header-sub{font-size:11px;color:var(--text-muted);letter-spacing:1px;white-space:nowrap}
.header-role{
  font-size:12px;color:#fff;padding:4px 10px;border-radius:20px;
  background:linear-gradient(135deg,var(--accent),#a8862f);
  box-shadow:0 2px 8px rgba(184,134,11,.4);white-space:nowrap;
  transition:all .4s ease;
}
.header-role b{font-weight:700;letter-spacing:1px}
/* ---------------- 左侧浮动 图层/路线卡片 ---------------- */
.layer-dock{
  position:fixed;top:60px;left:10px;bottom:64px;z-index:640;
  display:flex;flex-direction:column;gap:8px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.layer-dock::-webkit-scrollbar{display:none}
.dock-layer-cards{display:flex;flex-direction:column;gap:10px;width:138px}
/* ---------------- 左侧路线导航（图层列右侧） ---------------- */
.route-dock{
  position:fixed;top:60px;left:156px;z-index:640;
  display:flex;flex-direction:column;gap:10px;
  max-height:calc(100vh - 130px);overflow-y:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.route-dock::-webkit-scrollbar{display:none}
.dock-route-cards{display:flex;flex-direction:column;gap:10px;width:200px}
.layer-card{
  display:flex;flex-direction:column;justify-content:center;width:100%;min-height:96px;height:96px;
  text-align:left;cursor:pointer;padding:11px 10px;box-sizing:border-box;
  border:1px solid var(--border-dim);border-left:4px solid var(--layer-c,#8b6914);border-radius:10px;
  background:var(--card-bg);box-shadow:var(--shadow);transition:all .25s ease;
}
.layer-card:hover{transform:translateX(3px)}
.layer-card.active{box-shadow:0 3px 12px rgba(0,0,0,.18);transform:translateX(3px)}
.layer-card .lc-top{display:flex;align-items:center;gap:8px;margin-bottom:3px;overflow:hidden}
.layer-card .lc-emoji{font-size:22px;line-height:1}
.layer-card .lc-name{font-size:15px;font-weight:800;letter-spacing:1px;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-card .lc-ident{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-card .lc-prog{font-size:12px;color:var(--text-faint)}
/* ---------------- 路线卡片（展开于图层下方） ---------------- */
.route-card{
  display:flex;flex-direction:column;justify-content:center;width:100%;min-height:96px;height:96px;
  text-align:left;cursor:pointer;padding:10px 12px;box-sizing:border-box;
  border:1px solid var(--border-dim);border-left:3px solid var(--rc-c,#a3712f);border-radius:9px;
  background:rgba(255,252,242,.9);transition:all .25s ease;
}
.route-card:hover{transform:translateX(2px)}
.route-card.active{box-shadow:0 2px 8px rgba(0,0,0,.16);transform:translateX(2px)}
.route-card .rc-top{display:flex;align-items:center;gap:7px;overflow:hidden}
.route-card .rc-emoji{font-size:18px;flex:0 0 auto}
.route-card .rc-name{font-size:14px;font-weight:700;letter-spacing:.3px;color:var(--text-main);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-card .rc-done{font-size:11px;color:var(--green);font-weight:700;margin-left:auto;flex:0 0 auto}
.route-card .rc-ident{font-size:12px;color:var(--accent);font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.route-card .rc-prog{display:flex;align-items:center;gap:6px;margin-top:6px;flex-shrink:0}
.route-card .rc-bar{flex:1;height:5px;border-radius:2px;background:#E8DCBE;overflow:hidden}
.route-card .rc-bar-inner{height:100%;border-radius:2px;background:var(--rc-c,#a3712f);transition:width .5s ease}
.route-card .rc-count{font-size:12px;color:var(--text-faint);font-weight:700}
/* ---------------- 点位名称标注（地图标签） ---------------- */
.point-label{
  background:rgba(255,252,242,.98);border:2px solid rgba(139,0,0,.6);
  color:#2A1E14;font-size:14px;font-weight:800;padding:3px 9px;border-radius:8px;
  box-shadow:0 2px 8px rgba(60,47,40,.38);white-space:nowrap;letter-spacing:.5px;
}
/* ---------------- 地图 ---------------- */
#map{position:fixed;top:52px;left:0;right:0;bottom:0;z-index:1;background:#d9cfb2}
.map-hint{
  position:fixed;left:50%;transform:translateX(-50%);z-index:600;
  bottom:64px;font-size:12px;color:var(--text-muted);
  background:rgba(255,252,242,.92);padding:5px 14px;border-radius:20px;
  border:1px solid var(--border-dim);pointer-events:none;
  white-space:normal;text-align:center;max-width:92vw;line-height:1.6;
}
/* ---------------- 路线面板 ---------------- */
.route-panel{
  position:fixed;right:10px;top:60px;bottom:auto;width:min(320px,86vw);z-index:650;
  background:var(--card-bg);border:1px solid var(--border-dim);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden;
}
.rp-collapse{
  padding:7px 12px;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;
  background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(237,224,194,.4));
  border-bottom:1px solid var(--border-dim);letter-spacing:1px;user-select:none;text-align:center;
}
#routePanelBody{padding:10px 12px;max-height:34vh;overflow-y:auto}
.route-panel.collapsed #routePanelBody{display:none}
.rp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.rp-title{font-size:16px;font-weight:700;color:var(--text-main);letter-spacing:.5px}
.rp-count{font-size:14px;color:var(--text-muted);font-weight:700}
.rp-bar{height:6px;border-radius:3px;background:#E8DCBE;overflow:hidden;margin-bottom:8px}
.rp-bar-inner{height:100%;border-radius:3px;background:var(--gold);transition:width .5s ease}
.rp-points{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:6px}
.rp-point{
  display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer;
  border:1px dashed rgba(184,134,11,.35);border-radius:8px;
  background:rgba(255,252,242,.7);transition:all .2s ease;user-select:none;
}
.rp-point:hover{background:#F6EBD2;border-color:var(--gold);transform:translateY(-1px)}
.rp-point.done{background:linear-gradient(90deg,rgba(91,140,90,.16),rgba(255,252,242,.5));border-style:solid;border-color:rgba(91,140,90,.4)}
.rp-point .rp-n{font-size:12px;color:var(--text-faint);font-weight:700;flex:0 0 auto}
.rp-point .rp-name{font-size:14px;flex:1;color:var(--text-main);line-height:1.45;min-width:0}
.rp-point .rp-state{font-size:14px;color:var(--green);flex:0 0 auto}
.rp-point:not(.done) .rp-state{color:var(--text-faint)}
.rp-final{
  margin-top:8px;text-align:center;font-size:13px;font-weight:700;line-height:1.7;
  color:var(--red);padding:7px 10px;border-radius:8px;
  background:linear-gradient(90deg,rgba(184,134,11,.18),rgba(212,175,55,.12));
  border:1px solid var(--border-dim);animation:pop .4s ease;
}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
/* ---------------- 点位卡片 ---------------- */
.side-panel{
  position:fixed;right:10px;bottom:70px;top:auto;width:min(340px,86vw);max-height:calc(100vh - 150px);
  z-index:660;background:var(--card-bg);border:1px solid var(--border-dim);
  border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);overflow-y:auto;
  display:none;
}
.sp-photo{
  position:relative;width:100%;height:160px;border-radius:8px;margin-bottom:10px;
  border:2px solid rgba(201,169,110,.3);overflow:hidden;cursor:pointer;
  box-shadow:inset 0 2px 12px rgba(60,47,40,.25),0 4px 14px rgba(60,47,40,.2);
  background:#F3E7C8;
}
.sp-photo img{
  width:100%;height:100%;object-fit:cover;border-radius:8px;
  filter:sepia(10%) contrast(105%);
  opacity:0;transition:opacity .6s ease,transform .4s ease;
}
.sp-photo img.loaded{opacity:1}
.sp-photo:hover img{transform:scale(1.03)}
.sp-photo .sp-photo-label{
  position:absolute;top:8px;left:8px;z-index:2;
  background:rgba(60,47,40,.92);color:#D4AF37;
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;
  letter-spacing:1px;pointer-events:none;
}
.sp-photo .sp-fallback{
  position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;color:var(--text-muted);
  background:#F3E7C8;border-radius:8px;pointer-events:none;
}
.sp-photo.error .sp-fallback{display:flex}
.sp-photo.error img{display:none}
.sp-fallback .sf-emoji{font-size:46px;margin-bottom:6px}
.sp-fallback .sf-text{font-size:12px;letter-spacing:1px}
.lightbox{
  position:fixed;inset:0;z-index:3000;background:rgba(10,5,2,.95);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.lightbox.show{display:flex}
.lightbox img{max-width:90vw;max-height:80vh;border:2px solid #D4AF37;border-radius:6px;box-shadow:0 12px 50px rgba(0,0,0,.6)}
.lightbox .lb-tip{position:absolute;bottom:20px;color:#D4AF37;font-size:12px;letter-spacing:1px;opacity:.7;pointer-events:none}
.side-panel.open{display:block;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.sp-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;color:#fff;margin-right:4px;vertical-align:middle}
.sp-id{font-size:11px;color:var(--text-faint);letter-spacing:1px}
.sp-name{font-size:19px;font-weight:700;margin:6px 0 4px;color:var(--text-main)}
.sp-intro{font-size:12.5px;line-height:1.7;color:var(--text-main);margin-bottom:8px}
.sp-block{font-size:12px;background:#F3E7C8;border-radius:8px;padding:8px 10px;margin-bottom:6px;line-height:1.7}
.sp-block .sb-t{font-size:10px;color:var(--text-faint);letter-spacing:1px;margin-bottom:2px}
.sp-block .sb-t b{color:var(--gold)}
.sp-reward{font-size:12px;color:var(--red);font-weight:700;margin:6px 0}
.sp-done{font-size:12px;color:var(--green);font-weight:700;margin-top:4px}
.sp-btn{
  width:100%;margin-top:10px;padding:10px;border:none;border-radius:8px;cursor:pointer;
  font-size:14px;font-weight:700;letter-spacing:2px;color:#fff;
  background:linear-gradient(135deg,var(--gold),#a8862f);box-shadow:0 3px 10px rgba(184,134,11,.4);
  transition:all .25s ease;
}
.sp-btn:active{transform:scale(.97)}
.sp-btn.done{background:var(--green);cursor:default}
/* ---------------- 理论按钮 & 理论弹窗 ---------------- */
.theory-btn{
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:#fff;
  padding:7px 14px;border:none;border-radius:20px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--green),#4a7a4a);box-shadow:0 3px 10px rgba(91,140,90,.35);
}
.theory-btn:active{transform:scale(.97)}
.mech-btn{
  font-family:inherit;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;
  padding:8px 22px;border-radius:20px;color:#fff;border:none;
  background:linear-gradient(135deg,var(--green),#4a7a4a);box-shadow:0 3px 10px rgba(91,140,90,.35);
}
.mech-btn:active{transform:scale(.97)}
.tl-grid{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tl-card{
  background:var(--card-bg);border:1px solid var(--border-dim);border-radius:10px;
  padding:10px 12px;cursor:pointer;transition:all .2s;
}
.tl-card:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:var(--shadow)}
.tl-card .tc-no{font-size:10px;color:var(--text-faint);letter-spacing:1px}
.tl-card .tc-title{font-size:14px;font-weight:700;color:var(--accent);margin:2px 0}
.tl-card .tc-content{font-size:11.5px;line-height:1.7;color:var(--text-muted)}
.tl-mech{text-align:center;margin-top:14px}
/* ---------------- 底部按钮 ---------------- */
.footer{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 12px;background:var(--card-bg);border-top:2px solid var(--border-dim);
}
.archive-btn{
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:#fff;
  padding:7px 16px;border:none;border-radius:20px;
  background:linear-gradient(135deg,var(--red),#a52a2a);box-shadow:0 3px 10px rgba(139,0,0,.3);
}
.progress-wrap{flex:1;display:flex;align-items:center;gap:8px;max-width:340px}
.progress-text{font-size:12px;color:var(--text-muted);white-space:nowrap}
.progress-text b{color:var(--gold);font-size:14px}
.progress-bar{flex:1;height:8px;border-radius:4px;background:#E8DCBE;overflow:hidden}
.progress-bar-inner{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-light));transition:width .5s ease}
.archive-badge{
  position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;
  background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;
  padding:0 4px;font-weight:700;
}
.archive-btn-wrap{position:relative;flex:0 0 auto}
/* ---------------- 游戏弹窗 ---------------- */
.modal-overlay{
  position:fixed;inset:0;z-index:2000;background:rgba(44,34,20,.6);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.show{display:flex}
.modal{
  width:min(380px,94vw);max-height:86vh;overflow-y:auto;
  background:var(--card-bg);border:1px solid var(--border-dim);border-radius:12px;
  padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.4);
}
.modal-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:10px;color:var(--text-main)}
.modal-btn{
  width:100%;margin-top:12px;padding:10px;border:none;border-radius:8px;cursor:pointer;
  font-size:14px;font-weight:700;letter-spacing:2px;color:#fff;
  background:#C9C2AE;transition:all .25s;
}
.modal-btn.active{background:linear-gradient(135deg,var(--gold),#a8862f);box-shadow:0 3px 10px rgba(184,134,11,.4)}
/* 拼图 */
.puzzle-board{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(300px,90%);margin:0 auto}
.puzzle-piece{
  aspect-ratio:1.2;display:flex;align-items:center;justify-content:center;
  font-size:40px;border:1px dashed rgba(184,134,11,.4);border-radius:8px;
  background:linear-gradient(135deg,#F3E7C8,#EFE0BE);cursor:grab;user-select:none;
  transition:all .2s;
}
.puzzle-piece.selected{transform:scale(1.06);border:2px solid var(--gold);box-shadow:0 4px 12px rgba(184,134,11,.4)}
.puzzle-piece.placed{background:linear-gradient(135deg,rgba(91,140,90,.25),#EFE0BE);border-style:solid;border-color:var(--green);cursor:default}
/* 排序 */
.sort-list{display:flex;flex-direction:column;gap:6px}
.sort-item{
  padding:9px 11px;border:1px solid var(--border-dim);border-radius:8px;cursor:pointer;
  background:#F6EBD2;transition:all .2s;
}
.sort-item .sort-year{font-size:11px;color:var(--text-faint);margin-bottom:2px}
.sort-item .sort-desc{font-size:12px;line-height:1.5}
.sort-item.selected{border-color:var(--gold);background:rgba(184,134,11,.15)}
.sort-item.correct{border-color:var(--green);background:rgba(91,140,90,.15)}
.sort-item.wrong{border-color:var(--red);background:rgba(139,0,0,.1)}
.sort-pick-order{font-size:12px;color:var(--text-muted);margin-top:8px;text-align:center;min-height:18px}
/* 语音 */
.voice-player{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}
.voice-btn{
  width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);cursor:pointer;
  font-size:24px;background:linear-gradient(135deg,#F6EBD2,#EFE0BE);transition:all .2s;
}
.voice-btn.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(184,134,11,.5)}50%{box-shadow:0 0 0 12px rgba(184,134,11,0)}}
.voice-status{font-size:12px;color:var(--text-muted)}
.voice-question{font-size:14px;font-weight:700;margin:10px 0 8px;line-height:1.6}
.voice-options{display:flex;flex-direction:column;gap:6px}
.voice-opt{
  padding:9px 11px;border:1px solid var(--border-dim);border-radius:8px;cursor:pointer;
  background:#F6EBD2;font-size:12.5px;line-height:1.5;transition:all .2s;
}
.voice-opt.correct{border-color:var(--green);background:rgba(91,140,90,.2)}
.voice-opt.wrong{border-color:var(--red);background:rgba(139,0,0,.1)}
/* 对比 */
.compare-container{
  position:relative;width:min(320px,100%);height:190px;margin:10px auto;
  border-radius:10px;overflow:hidden;border:1px solid var(--border-dim);
}
.compare-old,.compare-new{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;color:var(--text-muted);gap:6px;background:#F1E6CA;
}
.compare-old{background:linear-gradient(135deg,#EDE0C2,#E4D3AC)}
.compare-new{background:linear-gradient(135deg,#DCE8D2,#CDE0C2);clip-path:inset(0 100% 0 0)}
.compare-handle{
  position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--gold);cursor:ew-resize;
}
.compare-handle::after{
  content:'⇔';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:26px;height:26px;border-radius:50%;background:#fff;color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:13px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
/* ---------------- 成功动画 ---------------- */
.success-overlay{
  position:fixed;inset:0;z-index:3000;background:rgba(44,34,20,.7);
  display:flex;align-items:center;justify-content:center;animation:fadeIn .3s;
}
.success-card{
  text-align:center;background:var(--card-bg);border:2px solid var(--gold);
  border-radius:14px;padding:26px 34px;box-shadow:0 12px 50px rgba(0,0,0,.5);
  animation:successPop .5s cubic-bezier(.2,1.6,.4,1);
}
.success-card .sc-icon{font-size:52px;margin-bottom:8px}
.success-card .sc-title{font-size:20px;font-weight:700;color:var(--gold);letter-spacing:2px;margin-bottom:6px}
.success-card .sc-reward{font-size:14px;color:var(--text-main);line-height:1.8}
.success-card .sc-btn{
  margin-top:16px;padding:9px 30px;border:none;border-radius:20px;cursor:pointer;
  font-size:14px;font-weight:700;color:#fff;letter-spacing:2px;
  background:linear-gradient(135deg,var(--gold),#a8862f);
}
@keyframes successPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* ---------------- 档案 ---------------- */
.archive-overlay{
  position:fixed;inset:0;z-index:2500;background:rgba(44,34,20,.75);
  overflow-y:auto;padding:20px 14px;
}
.archive-box{
  max-width:860px;margin:0 auto;background:var(--card-bg);border-radius:14px;
  padding:18px;box-shadow:0 12px 50px rgba(0,0,0,.5);
}
.archive-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}

var map,mapMarkers=[];
function getRoutes(){return ALL_LAYERS[activeLayer].routes;}
function isRepaired(id){try{var r=JSON.parse(localStorage.getItem('fixedPoints')||'[]');return r.indexOf(id)!==-1;}catch(e){return false;}}
function getRepairedCount(){var n=0;for(var k in ALL_LAYERS){ALL_LAYERS[k].routes.forEach(function(r){r.points.forEach(function(p){if(isRepaired(p.id))n++;});});}return n;}
function getAchievedRoutes(){try{return JSON.parse(localStorage.getItem('achievedRoutes')||'[]');}catch(e){return [];}}
function getAchievedComposites(){try{return JSON.parse(localStorage.getItem('achievedComposites')||'[]');}catch(e){return [];}}
function findPointById(id){for(var k in ALL_LAYERS){for(var i=0;i<ALL_LAYERS[k].routes.length;i++){var r=ALL_LAYERS[k].routes[i];for(var j=0;j<r.points.length;j++){if(r.points[j].id===id)return r.points[j];}}}return null;}
function findRouteOfPoint(id){for(var k in ALL_LAYERS){for(var i=0;i<ALL_LAYERS[k].routes.length;i++){var r=ALL_LAYERS[k].routes[i];for(var j=0;j<r.points.length;j++){if(r.points[j].id===id)return r;}}}return null;}
/* ============================================================
   MAP
   ============================================================ */
function initMap(){
  if(map)return;
  map=L.map('map',{zoomControl:false,attributionControl:true}).setView([30.58,114.30],13);
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'高德地图'}).addTo(map);
  window.addEventListener('resize',function(){map.invalidateSize();});
}
function layerEmoji(){return ALL_LAYERS[activeLayer].emoji;}
function updateMap(){
  if(mapMarkers){mapMarkers.forEach(function(m){map.removeLayer(m);});mapMarkers=[];}
  var r=getRoutes()[activeRouteIdx];
  var emoji=layerEmoji(),color=ALL_LAYERS[activeLayer].color;
  r.points.forEach(function(p){
    var done=isRepaired(p.id);
    var icon=L.divIcon({
      className:'leaflet-div-icon',
      html:'<div class="marker-pin'+(done?' done':'')+'" style="background:'+color+'"><span>'+emoji+'</span></div>',
      iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-30]
    });
    var m=L.marker([p.lat,p.lng],{icon:icon}).addTo(map);
    m.bindTooltip(p.name,{permanent:true,direction:'top',offset:[0,-42],className:'point-label',opacity:1});
    m.on('click',function(){openSidePanel(p.id);});
    mapMarkers.push(m);
  });
}
/* ============================================================
   LAYER / ROUTE DOCK (左侧浮动卡片)
   ============================================================ */
function layerProgress(key){
  var tot=0,done=0;
  ALL_LAYERS[key].routes.forEach(function(r){r.points.forEach(function(p){tot++;if(isRepaired(p.id))done++;});});
  return {done:done,total:tot};
}
function renderLayerCards(){
  var c=document.getElementById('layerCards');c.innerHTML='';
  LAYER_TABS.forEach(function(t){
    var L=ALL_LAYERS[t.key];
    var pr=layerProgress(t.key);
    var card=document.createElement('div');
    card.className='layer-card'+(t.key===activeLayer?' active':'');
    card.style.setProperty('--layer-c',L.color);
    card.innerHTML=
      '<div class="lc-top"><span class="lc-emoji">'+t.emoji+'</span><span class="lc-name">'+t.name+'</span></div>'+
      '<div class="lc-ident">🎭 '+L.identity+'</div>'+
      '<div class="lc-prog">进度 '+pr.done+'/'+pr.total+'</div>';
    card.onclick=function(){activateLayer(t.key,0);};
    c.appendChild(card);
  });
}
function renderRouteCards(){
  var c=document.getElementById('routeCards');c.innerHTML='';
  getRoutes().forEach(function(r,i){
    var tot=r.points.length,done=0;
    r.points.forEach(function(p){if(isRepaired(p.id))done++;});
    var ident=r.finalReward.replace(/[「」]/g,'');
    var card=document.createElement('div');
    card.className='route-card'+(i===activeRouteIdx?' active':'');
    card.style.setProperty('--rc-c',r.color);
    card.innerHTML=
      '<div class="rc-top"><span class="rc-emoji">'+r.emoji+'</span><span class="rc-name">'+r.name+'</span>'+
      (done===tot?'<span class="rc-done">✔</span>':'')+'</div>'+
      '<div class="rc-ident">🎭 '+ident+'</div>'+
      '<div class="rc-prog"><span class="rc-bar"><span class="rc-bar-inner" style="width:'+(tot?Math.round(done/tot*100):0)+'%"></span></span>'+
      '<span class="rc-count">'+done+'/'+tot+'</span></div>';
    card.onclick=function(){activateRoute(i);};
    c.appendChild(card);
  });
}
function showRouteDock(){var d=document.getElementById('routeDock');if(d)d.style.display='';}
function activateLayer(key,idx){
  activeLayer=key;activeRouteIdx=(idx===undefined?0:idx);
  renderLayerCards();renderRouteCards();showRouteDock();enterRouteView();
}
function activateRoute(idx){activeRouteIdx=idx;renderRouteCards();enterRouteView();}
function enterRouteView(){
  var layer=ALL_LAYERS[activeLayer],r=getRoutes()[activeRouteIdx];
  var ident=r.finalReward.replace(/[「」]/g,'');
  document.getElementById('headerRole').innerHTML='<b>'+ident+'</b>';
  document.getElementById('headerRole').style.background='linear-gradient(135deg,'+layer.color+',#a8862f)';

function renderRoutePanel(){

  var done=0;r.points.forEach(function(p){if(isRepaired(p.id))done++;});
  var pct=total?Math.round(done/total*100):0;
  var html='<div class="rp-head"><span class="rp-title">'+r.emoji+' '+r.name+'</span><span class="rp-count">'+done+'/'+total+' 完成</span></div>';
  html+='<div class="rp-bar"><div class="rp-bar-inner" style="width:'+pct+'%;background:'+r.color+'"></div></div>';
  html+='<div class="rp-points">';

    var rep=isRepaired(p.id);
    html+='<div class="rp-point'+(rep?' done':'')+'" style="border-color:'+(rep?'rgba(91,140,90,.4)':'rgba(184,134,11,.35)')+'" onclick="flyToPoint(\''+p.id+'\')">';
    html+='<span class="rp-n">'+(i+1)+'</span><span class="rp-name">'+p.name+'</span><span class="rp-state">'+(rep?'✓':'○')+'</span></div>';
  });
  html+='</div>';
  var ar=getAchievedRoutes();
  if(done===total&&ar.indexOf(r.id)!==-1){  html+='<div class="rp-final">🏆 路线终极成就已解锁：'+r.finalReward+'</div>';}

function toggleRoutePanel(){

function flyToPoint(id){
  var p=findPointById(id);
  if(!p)return;
  var r=findRouteOfPoint(id);
  var layerKey=getLayerOfPoint(id);
  if(layerKey!==activeLayer){
    var routes=ALL_LAYERS[layerKey].routes;
    for(var i=0;i<routes.length;i++){if(routes[i].id===r.id){activateLayer(layerKey,i);break;}}
    setTimeout(function(){map.flyTo([p.lat,p.lng],16,{duration:.6});openSidePanel(id);},450);
    return;
  }
  map.flyTo([p.lat,p.lng],16,{duration:.8});
  openSidePanel(id);
}
function getLayerOfPoint(id){
  for(var k in ALL_LAYERS){for(var i=0;i<ALL_LAYERS[k].routes.length;i++){var r=ALL_LAYERS[k].routes[i];for(var j=0;j<r.points.length;j++){if(r.points[j].id===id)return k;}}}
  return null;
}

function completeRepair(id){
  var p=findPointById(id);if(!p)return;
  var list=[];
  try{list=JSON.parse(localStorage.getItem('fixedPoints')||'[]');}catch(e){}
  if(list.indexOf(id)===-1)list.push(id);
  localStorage.setItem('fixedPoints',JSON.stringify(list));
  closeGame();closeSidePanel();
  updateMap();updateProgress();updateArchiveBadge();renderRoutePanel();
  var layer=ALL_LAYERS[activeLayer];
  showSuccess(layer.emoji,'修复完成！',p.name,p.reward,function(){
    var r=findRouteOfPoint(id);
    if(r){
      var done=r.points.filter(function(x){return isRepaired(x.id);}).length;
      var ar=getAchievedRoutes();
      if(done===r.points.length&&ar.indexOf(r.id)===-1){
        ar.push(r.id);localStorage.setItem('achievedRoutes',JSON.stringify(ar));
        showSuccess('🏆','路线达成！',r.name,r.finalReward,null);
      }
    }
    checkCompositeAchievements();
  });
}
function checkCompositeAchievements(){
  var done=getAchievedComposites();
  COMPOSITE_ACHIEVEMENTS.forEach(function(ca){
    if(done.indexOf(ca.id)===-1&&ca.check()){
      done.push(ca.id);localStorage.setItem('achievedComposites',JSON.stringify(done));
      showSuccess(ca.icon,'复合成就解锁！',ca.name,ca.desc,null);
    }
  });
}
function showSuccess(icon,title,name,reward,cb){

  ov.addEventListener('click',function(e){if(e.target===ov){ov.remove();if(cb)cb();}});
  var btn=ov.querySelector('.sc-btn');

/* ---- PUZZLE ---- */
function buildPuzzleGame(gc,pt,setBtnDone){
  var emojis=['🏛️','🌉','🎭','🕰️'];
  var pieces=emojis.slice(0,4);
  var slots=[null,null,null,null];
  var html='<div style="text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:8px">点击碎片，再点击空位放入</div><div class="puzzle-board">';
  for(var i=0;i<4;i++){html+='<div class="puzzle-piece" id="slot'+i+'" onclick="putPiece('+i+')">❔</div>';}
  html+='</div><div style="height:8px"></div><div class="puzzle-board">';
  pieces.forEach(function(e,i){html+='<div class="puzzle-piece" id="piece'+i+'" onclick="pickPiece('+i+')">'+e+'</div>';});
  html+='</div>';
  gc.innerHTML=html;
  gc._slots=slots;gc._pieceEmojis=pieces;
  gc._tryPlace=function(idx){
    var slot=document.getElementById('slot'+idx);
    if(slot.classList.contains('placed'))return;
    var pe=gc._pendingPiece;
    if(pe==null)return;
    slot.textContent=pe;
    slot.classList.add('placed');
    document.getElementById('piece'+gc._pendingIdx).style.visibility='hidden';
    slots[idx]=pe;
    gc._pendingPiece=null;gc._pendingIdx=null;
    if(slots.every(function(s){return s!==null;})){
      var btn=document.querySelector('#gameModal .modal-btn');
      btn.disabled=false;btn.classList.add('active');btn.textContent='🔧 确认修复';
      btn.onclick=function(){setBtnDone();};
    }
  };
}
window.pickPiece=function(idx){
  var gc=document.getElementById('gameContent');if(!gc)return;
  var pieces=document.querySelectorAll('#gameContent .puzzle-piece');
  pieces.forEach(function(el){el.classList.remove('selected');});
  var el=document.getElementById('piece'+idx);
  if(el.style.visibility==='hidden')return;
  el.classList.add('selected');
  gc._pendingIdx=idx;gc._pendingPiece=gc._pieceEmojis[idx];
};
window.putPiece=function(idx){var gc=document.getElementById('gameContent');if(gc&&gc._tryPlace)gc._tryPlace(idx);};
/* ---- SORT ---- */
function buildSortGame(gc,pt,setBtnDone){
  var events=pt.events||[{year:'事件一',desc:'请按时间顺序排列'},{year:'事件二',desc:'请按时间顺序排列'},{year:'事件三',desc:'请按时间顺序排列'}];
  var correctOrder=events.map(function(_,i){return i;});
  var shuffled=events.slice().sort(function(){return Math.random()-.5;});
  var selected=[];
  var html='<div style="text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:8px">按时间先后顺序点击选择</div><div class="sort-list">';
  shuffled.forEach(function(ev,i){
    html+='<div class="sort-item" id="sortItem'+i+'" onclick="selectSortItem('+i+',\''+ev.year+'\')"><div class="sort-year">📅 时间未知</div><div class="sort-desc">'+ev.desc+'</div></div>';
  });
  html+='</div><div class="sort-pick-order" id="sortOrder">请按时间先后点击...</div>';
  gc.innerHTML=html;
  gc._shuffled=shuffled;gc._events=events;gc._selected=selected;gc._correctOrder=correctOrder;
}
window.selectSortItem=function(idx,yearStr){
  var gc=document.getElementById('gameContent');if(!gc||!gc._shuffled)return;
  var item=document.getElementById('sortItem'+idx);
  if(gc._selected.indexOf(idx)!==-1)return;
  gc._selected.push(idx);
  item.classList.add('selected');
  item.querySelector('.sort-year').textContent='📅 '+yearStr;
  var orderEl=document.getElementById('sortOrder');
  orderEl.textContent='已选顺序：'+gc._selected.map(function(si,i){return (i+1)+'. '+gc._shuffled[si].desc.substring(0,8)+'...';}).join(' → ');
  if(gc._selected.length===3){
    var correct=true;
    for(var i=0;i<3;i++){if(gc._selected[i]!==gc._correctOrder[i]){correct=false;break;}}
    if(correct){
      var items=gc.querySelectorAll('.sort-item');
      items.forEach(function(it){it.classList.add('correct');});
      var btn=document.querySelector('#gameModal .modal-btn');
      btn.disabled=false;btn.classList.add('active');btn.textContent='🔧 确认修复';
      btn.onclick=function(){setBtnDone();};
    }else{
      orderEl.textContent='❌ 顺序错误，请重试！';
      var items=gc.querySelectorAll('.sort-item');
      items.forEach(function(it){it.classList.add('wrong');});
      setTimeout(function(){
        items.forEach(function(it){it.classList.remove('selected','wrong');});
        gc._selected=[];orderEl.textContent='请按时间先后点击...';
        items.forEach(function(it,i){it.querySelector('.sort-year').textContent='📅 时间未知';});
      },800);
    }
  }
};

window.playVoice=function(){

    var opts=document.querySelectorAll('#gameContent .voice-opt');

    opt.classList.add('wrong');
    setTimeout(function(){opt.classList.remove('wrong');},1000);

/* ---- COMPARE ---- */
function buildCompareGame(gc,pt,setBtnDone){
  var dragged=false;
  var html='<div style="text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:8px">拖动中间滑块对比今昔</div>';
  html+='<div class="compare-container" id="compareContainer">';
  html+='<div class="compare-old"><span style="font-size:46px">🕰️</span><div>昔日旧影</div><div class="compare-label" style="font-size:11px;color:var(--text-faint)">老照片资料</div></div>';
  html+='<div class="compare-new" id="compareNew"><span style="font-size:46px">📸</span><div>今朝新貌</div><div class="compare-label" style="font-size:11px;color:var(--text-faint)">实地打卡</div></div>';
  html+='<div class="compare-handle" id="compareHandle"></div></div>';
  gc.innerHTML=html;
  var handle=document.getElementById('compareHandle');
  var container=document.getElementById('compareContainer');
  var newEl=document.getElementById('compareNew');
  function onMove(e){
    var rect=container.getBoundingClientRect();
    var x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
    var pct=Math.max(5,Math.min(95,(x/rect.width)*100));
    handle.style.left=pct+'%';
    newEl.style.clipPath='inset(0 '+(100-pct)+'% 0 0)';
    dragged=true;
  }
  function done(){
    if(dragged){
      var btn=document.querySelector('#gameModal .modal-btn');
      btn.disabled=false;btn.classList.add('active');btn.textContent='🔧 完成对比，确认修复';
      btn.onclick=function(){setBtnDone();};
    }
  }
  handle.addEventListener('mousedown',function(e){e.preventDefault();window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',function(){window.removeEventListener('mousemove',onMove);done();},{once:true});});
  handle.addEventListener('touchstart',function(e){e.preventDefault();window.addEventListener('touchmove',onMove);window.addEventListener('touchend',function(){window.removeEventListener('touchmove',onMove);done();},{once:true});});
}

  var cnt=getRepairedCount();
  document.getElementById('progressDone').textContent=cnt;
  document.getElementById('progressTotal').textContent=TOTAL_POINTS;
  document.getElementById('progressBar').style.width=((cnt/TOTAL_POINTS)*100)+'%';
}
function init(){
  initMap();
  document.getElementById('progressTotal').textContent=TOTAL_POINTS;
  activeLayer='L';activeRouteIdx=0;
  renderLayerCards();
  updateProgress();updateArchiveBadge();
  var initHash=(location.hash||'').replace('#','');
  if(initHash&&ALL_LAYERS[initHash]){activateLayer(initHash,0);}
}
function showLightbox(src){
  var lb=document.getElementById('lightbox');
  if(!lb)return;
  lb.querySelector('img').src=src;
  lb.classList.add('show');
}
function closeLightbox(){
  var lb=document.getElementById('lightbox');
  if(lb)lb.classList.remove('show');
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeLightbox();closeGame();}});
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
