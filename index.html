<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>江城往事 — 时间修复师</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ============================================================
   CSS RESET & DESIGN TOKENS
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FAF0E6;--card-bg:#FFF8F0;--border:#D4C5B2;--border-dim:#E0D5C5;
  --text-main:#3C2F28;--text-body:#4A3B33;--text-muted:#6B5D4F;--text-faint:#9B8D7F;
  --blue:#B8860B;--blue-hover:#D4A030;--blue-text:#8B6914;
  --green:#5B8C5A;--orange:#D4843A;--red:#C45A4A;--purple:#7B6BA6;
  --h1-color:var(--orange);--h2-color:var(--red);--h3-color:var(--green);--h4-color:var(--purple);
}
body{
  font-family:"KaiTi","STKaiti","PingFang SC","Microsoft YaHei","Noto Sans SC",serif;
  background:var(--bg);color:var(--text-body);overflow-x:hidden;min-height:100vh;
  background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
}
/* ---- header ---- */
.header{
  background:linear-gradient(135deg,#F5EDE0 0%,#EDE1D0 100%);
  padding:18px 20px 14px;border-bottom:2px solid #D4C5B2;
  position:relative;overflow:hidden;
}
.header::before{
  content:"";position:absolute;top:0;left:0;right:0;bottom:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%238B6914' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  opacity:0.8;
}
.header-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.header-top h1{font-size:28px;font-weight:700;color:var(--text-main);letter-spacing:6px;font-family:"KaiTi","STKaiti",serif}
.header-role{font-size:13px;color:var(--blue-text);background:rgba(184,134,11,0.1);padding:5px 14px;border-radius:20px;letter-spacing:2px;border:1px solid rgba(184,134,11,0.2)}
.header-progress{margin-top:12px;position:relative;z-index:1;display:flex;align-items:center;gap:10px}
.progress-bar-outer{flex:1;height:8px;background:var(--border-dim);border-radius:4px;overflow:hidden}
.progress-bar-inner{height:100%;background:var(--blue);border-radius:4px;transition:width .5s ease;width:0%}
.progress-text{font-size:13px;color:var(--text-muted);white-space:nowrap}
.progress-text .done{color:var(--green);font-weight:700}
/* ---- route selector ---- */
.route-selector{
  display:flex;gap:10px;padding:12px 16px;background:var(--card-bg);
  border-bottom:1px solid var(--border-dim);overflow-x:auto;scrollbar-width:none;
}
.route-selector::-webkit-scrollbar{display:none}
.route-tab{
  flex-shrink:0;padding:8px 16px;border-radius:8px;background:#F5EDE0;
  border:1px solid var(--border);cursor:pointer;transition:all .25s ease;
  min-width:125px;text-align:center;position:relative;
}
.route-tab:hover{background:#EDE1D0;border-color:var(--blue-text)}
.route-tab.active{border-color:currentColor;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.route-tab[data-route="0"]{color:var(--h1-color)}
.route-tab[data-route="1"]{color:var(--h2-color)}
.route-tab[data-route="2"]{color:var(--h3-color)}
.route-tab[data-route="3"]{color:var(--h4-color)}
.route-tab .tab-name{font-size:13px;font-weight:600}
.route-tab .tab-theme{font-size:11px;opacity:.75;margin-top:2px}
.route-tab .tab-emoji{font-size:16px;margin-right:4px}
/* ---- identity card ---- */
.identity-card{
  margin:12px 16px;padding:16px 18px;background:var(--card-bg);
  border-radius:10px;border:1px solid var(--border-dim);position:relative;overflow:hidden;
  transition:border-color .3s;box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
.identity-card .id-title{font-size:11px;color:var(--blue-text);letter-spacing:2px;margin-bottom:6px}
.identity-card .id-name{font-size:18px;font-weight:700;color:var(--text-main);margin-bottom:6px}
.identity-card .id-desc{font-size:12px;color:var(--text-muted);line-height:1.6}
.identity-card .id-reward{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
/* ---- map ---- */
.map-section{margin:0 16px 12px;border-radius:10px;overflow:hidden;border:1px solid var(--border-dim);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
#map{width:100%;height:380px}
.custom-marker-container{background:transparent!important;border:none!important}
.custom-marker{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);
  transition:all .3s;
}
.custom-marker.repaired{opacity:.6;border-color:var(--green)}
/* ---- side panel (right floating card) ---- */
.side-panel-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(60,47,40,.4);
  z-index:900;display:none;
}
.side-panel-overlay.show{display:block}
.side-panel{
  position:fixed;top:50%;right:20px;transform:translateY(-50%);
  width:320px;max-width:calc(100vw - 40px);max-height:80vh;
  background:var(--card-bg);z-index:901;
  box-shadow:-4px 8px 32px rgba(0,0,0,.18);overflow-y:auto;
  padding:18px 16px;border-radius:12px;border:1px solid var(--border-dim);
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.side-panel.open{opacity:1;pointer-events:auto}
.side-panel .sp-close{
  float:right;background:none;border:none;color:var(--text-muted);font-size:20px;
  cursor:pointer;line-height:1;padding:0 0 4px 4px;
}
.side-panel .sp-id{font-size:11px;color:var(--blue-text);background:rgba(184,134,11,0.1);padding:3px 8px;border-radius:3px;font-family:"KaiTi","STKaiti",serif;display:inline-block;margin-bottom:4px}
.side-panel .sp-name{font-size:18px;font-weight:700;color:var(--text-main);margin-bottom:2px}
.side-panel .sp-year{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.side-panel .sp-tags{display:flex;gap:6px;margin:6px 0 8px;flex-wrap:wrap}
.sp-tag{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500}
.sp-tag.type-building{background:rgba(212,132,58,0.12);color:var(--orange)}
.sp-tag.type-event{background:rgba(196,90,74,0.12);color:var(--red)}
.sp-tag.type-person{background:rgba(123,107,166,0.12);color:var(--purple)}
.sp-tag.type-life{background:rgba(91,140,90,0.12);color:var(--green)}
.sp-tag.play-puzzle{background:rgba(184,134,11,0.12);color:var(--blue-text)}
.sp-tag.play-sort{background:rgba(196,90,74,0.12);color:var(--red)}
.sp-tag.play-voice{background:rgba(123,107,166,0.12);color:var(--purple)}
.sp-tag.play-compare{background:rgba(91,140,90,0.12);color:var(--green)}
.side-panel .sp-task{font-size:12px;color:var(--orange);font-weight:600;margin-top:4px}
.side-panel .sp-desc{font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.6}
.side-panel .sp-reward{font-size:12px;color:var(--green);margin-top:6px}
.side-panel .sp-btn{
  display:block;width:100%;margin-top:12px;padding:10px;border-radius:8px;border:none;
  font-size:13px;font-weight:600;cursor:pointer;transition:all .3s;
  background:var(--blue);color:#fff;
}
.side-panel .sp-btn:hover{background:var(--blue-hover)}
.side-panel .sp-btn.done{background:var(--green);pointer-events:none}
.side-panel .sp-repaired{display:inline-block;margin-left:6px;font-size:10px;color:var(--green);background:rgba(91,140,90,0.1);padding:2px 6px;border-radius:3px;vertical-align:middle}
/* ---- map hint ---- */
.map-hint{text-align:center;font-size:11px;color:var(--text-faint);padding:4px 0 10px;margin:0 16px}
/* ---- modal ---- */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(60,47,40,.6);
  z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;
}
.modal-box{
  background:var(--card-bg);border:1px solid var(--border);border-radius:12px;
  width:100%;max-width:440px;max-height:85vh;overflow-y:auto;padding:20px;
  box-shadow:0 8px 32px rgba(0,0,0,.12);
}
.modal-box h3{font-size:17px;color:var(--text-main);margin-bottom:4px}
.modal-box .modal-sub{font-size:12px;color:var(--text-muted);margin-bottom:14px}
.modal-close{
  float:right;background:none;border:none;color:var(--text-muted);font-size:22px;
  cursor:pointer;line-height:1;
}
/* puzzle */
.puzzle-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;width:240px;height:240px;margin:10px auto}
.puzzle-slot{border:2px dashed var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:40px;transition:all .3s;background:rgba(245,237,224,0.5)}
.puzzle-slot.filled{border-color:var(--green);background:rgba(91,140,90,0.08)}
.puzzle-pieces{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.puzzle-piece{width:54px;height:54px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:grab;background:#F5EDE0;transition:all .2s}
.puzzle-piece:active{cursor:grabbing}
.puzzle-piece.placed{opacity:.3;pointer-events:none}
/* sort */
.sort-list{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.sort-item{padding:12px;border:2px solid var(--border-dim);border-radius:8px;cursor:pointer;background:#F5EDE0;transition:all .2s;text-align:center}
.sort-item:hover{border-color:var(--blue)}
.sort-item.selected{border-color:var(--blue);background:rgba(184,134,11,0.08)}
.sort-item.correct{border-color:var(--green)!important;background:rgba(91,140,90,0.08)!important}
.sort-item.wrong{border-color:var(--red)!important;animation:shake .5s}
.sort-item .sort-year{font-size:11px;color:var(--text-muted)}
.sort-item .sort-desc{font-size:13px;color:var(--text-body);margin-top:2px}
.sort-pick-order{font-size:11px;color:var(--blue-text);margin-top:6px;min-height:18px}
/* voice */
.voice-player{text-align:center;margin:16px 0}
.voice-btn{width:72px;height:72px;border-radius:50%;border:2px solid var(--blue);background:rgba(184,134,11,0.08);cursor:pointer;font-size:32px;transition:all .2s}
.voice-btn:hover{background:rgba(184,134,11,0.15)}
.voice-btn.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(184,134,11,.4)}50%{box-shadow:0 0 0 16px rgba(184,134,11,0)}}
.voice-status{font-size:12px;color:var(--text-muted);margin-top:8px}
.voice-question{margin-top:12px;font-size:13px;color:var(--text-body)}
.voice-options{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.voice-opt{padding:10px;border:1px solid var(--border-dim);border-radius:6px;cursor:pointer;background:#F5EDE0;font-size:12px;text-align:center;transition:all .2s}
.voice-opt:hover{border-color:var(--blue)}
.voice-opt.correct{border-color:var(--green)!important;background:rgba(91,140,90,0.08)!important}
.voice-opt.wrong{border-color:var(--red)!important;animation:shake .5s}
/* compare */
.compare-container{position:relative;width:100%;height:220px;border-radius:8px;overflow:hidden;margin:10px 0}
.compare-old,.compare-new{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}
.compare-old{background:#EDE1D0;z-index:1;color:var(--text-body)}
.compare-new{background:#E8F0E8;clip-path:inset(0 50% 0 0);z-index:2;color:var(--text-body)}
.compare-label{font-size:11px;color:var(--text-muted);margin-top:6px}
.compare-handle{
  position:absolute;top:0;bottom:0;width:4px;background:var(--blue);
  left:50%;transform:translateX(-50%);z-index:3;cursor:ew-resize;
}
.compare-handle::after{content:"◀▶";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--blue);color:#fff;font-size:12px;padding:6px 4px;border-radius:4px;white-space:nowrap}
/* modal button */
.modal-btn{
  display:block;width:100%;margin-top:14px;padding:12px;border-radius:8px;border:none;
  font-size:14px;font-weight:600;cursor:pointer;transition:all .3s;
  background:var(--border-dim);color:var(--text-muted);
}
.modal-btn.active{background:var(--blue);color:#fff}
.modal-btn.active:hover{background:var(--blue-hover)}
.modal-btn.done{background:var(--green);color:#fff;pointer-events:none}
/* success overlay */
.success-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(60,47,40,.9);
  z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.success-icon{font-size:64px;animation:bounceIn .6s ease}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.success-title{font-size:24px;color:var(--green);font-weight:700;margin-top:12px}
.success-reward{font-size:14px;color:var(--text-body);margin-top:8px}
/* archive button */
.archive-btn{
  position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;
  background:var(--blue);border:2px solid var(--blue-hover);cursor:pointer;
  font-size:28px;color:#fff;z-index:500;box-shadow:0 4px 16px rgba(184,134,11,.3);
  display:flex;align-items:center;justify-content:center;transition:all .3s;
}
.archive-btn:hover{background:var(--blue-hover);transform:scale(1.08)}
.archive-btn .badge{
  position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;
  font-size:10px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;
}
/* archive modal */
.archive-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(250,240,230,.97);
  z-index:1500;overflow-y:auto;padding:20px 16px;
}
.archive-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.archive-header h3{font-size:20px;color:var(--text-main)}
.archive-close{background:none;border:none;color:var(--text-muted);font-size:28px;cursor:pointer}
.archive-progress{margin-bottom:16px}
.archive-route-progress{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--text-muted)}
.archive-route-progress .rp-name{min-width:100px;font-weight:600}
.archive-route-progress .rp-bar{flex:1;height:6px;background:var(--border-dim);border-radius:3px;overflow:hidden}
.archive-route-progress .rp-bar-inner{height:100%;border-radius:3px;transition:width .5s}
.archive-route-progress .rp-num{min-width:36px;text-align:right}
.archive-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.archive-card{
  aspect-ratio:3/4;border-radius:8px;border:1px solid var(--border-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px;transition:all .3s;background:var(--card-bg);
}
.archive-card.unlocked{border-color:var(--green);background:rgba(91,140,90,0.08)}
.archive-card.locked{border-color:var(--border-dim);background:#F5EDE0;opacity:.7}
.archive-card .arc-id{font-size:10px;color:var(--text-muted);margin-bottom:2px}
.archive-card .arc-name{font-size:11px;color:var(--text-main);font-weight:600;text-align:center}
.archive-card .arc-icon{font-size:28px;margin-bottom:4px}
/* shake */
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
/* theory section */
.theory-section{
  margin:0 16px 16px;padding:14px;border-top:1px solid var(--border-dim);
  position:relative;
}
.theory-title{font-size:14px;font-weight:600;color:var(--text-main);margin-bottom:12px}
/* theory circle buttons */
.theory-circles{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-start}
.theory-circle-btn{
  width:56px;height:56px;border-radius:50%;border:2px solid var(--border);
  background:var(--card-bg);cursor:pointer;transition:all .3s ease;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:var(--text-main);
  position:relative;box-shadow:0 2px 8px rgba(0,0,0,0.05);
}
.theory-circle-btn:hover{border-color:var(--blue);transform:scale(1.1);box-shadow:0 4px 16px rgba(184,134,11,0.15)}
.theory-circle-btn.c1{border-color:var(--orange);color:var(--orange)}
.theory-circle-btn.c2{border-color:var(--red);color:var(--red)}
.theory-circle-btn.c3{border-color:var(--green);color:var(--green)}
.theory-circle-btn.c4{border-color:var(--purple);color:var(--purple)}
/* theory popup */
.theory-popup-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(60,47,40,.5);
  z-index:950;display:none;align-items:center;justify-content:center;padding:16px;
}
.theory-popup-overlay.show{display:flex}
.theory-popup{
  background:var(--card-bg);border:1px solid var(--border);border-radius:12px;
  width:100%;max-width:400px;padding:20px;
  box-shadow:0 8px 32px rgba(0,0,0,.12);
}
.theory-popup .tp-title{font-size:17px;font-weight:700;color:var(--text-main);margin-bottom:8px}
.theory-popup .tp-content{font-size:13px;color:var(--text-muted);line-height:1.7}
.theory-popup .tp-close{
  float:right;background:none;border:none;color:var(--text-muted);font-size:22px;
  cursor:pointer;line-height:1;
}
.theory-goal{font-size:11px;color:var(--text-faint);margin-top:14px;line-height:1.5}
/* footer */
.footer{text-align:center;padding:16px;color:var(--text-faint);font-size:11px;border-top:1px solid var(--border-dim)}
/* leaflet overrides */
.leaflet-popup-content-wrapper{background:var(--card-bg);color:var(--text-body);border-radius:8px;border:1px solid var(--border-dim);box-shadow:0 2px 12px rgba(0,0,0,.1)}
.leaflet-popup-tip{background:var(--card-bg)}
.leaflet-popup-content{margin:10px 12px;font-size:12px}
.popup-name{font-weight:600;color:var(--text-main);font-size:13px}
.popup-id{font-size:10px;color:var(--text-muted)}
.popup-task{font-size:11px;color:var(--orange);margin-top:4px}
/* responsive */
@media (max-width:600px){
  .header-top h1{font-size:20px;letter-spacing:3px}
  .header-role{font-size:11px;padding:4px 10px}
  #map{height:260px}
  .archive-grid{grid-template-columns:repeat(2,1fr)}
  .route-tab{padding:6px 10px;min-width:100px}
  .route-tab .tab-name{font-size:11px}
  .puzzle-grid{width:180px;height:180px}
}
</style>
</head>
<body>

<!-- ========== HEADER ========== -->
<div class="header">
  <div class="header-top">
    <h1>江城往事</h1>
    <span class="header-role">🔧 武汉时间修复师</span>
  </div>
  <div class="header-progress">
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
    <span class="progress-text">已修复 <span class="done" id="progressDone">0</span>/25</span>
  </div>
</div>

<!-- ========== ROUTE SELECTOR ========== -->
<div class="route-selector" id="routeSelector"></div>

<!-- ========== IDENTITY CARD ========== -->
<div class="identity-card" id="identityCard">
  <div class="id-title">当前身份</div>
  <div class="id-name" id="idName">请选择路线</div>
  <div class="id-desc" id="idDesc">点击上方路线卡片，选择你的历史身份，开启江城往事探索之旅。</div>
  <span class="id-reward" id="idReward" style="background:rgba(184,134,11,0.1);color:var(--blue-text)">等待选择...</span>
</div>

<!-- ========== MAP ========== -->

function saveRepair(){ localStorage.setItem('repairedPoints',JSON.stringify(repairedPoints)); }
function isRepaired(id){ return repairedPoints.indexOf(id)!==-1; }

/* ============================================================
   MAP
   ============================================================ */
function initMap(){
  map = L.map('map',{center:[30.55,114.30],zoom:12,zoomControl:false});
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}',{
    subdomains:'1234',attribution:'&copy; 高德地图',maxZoom:19
  }).addTo(map);
}

function updateMap(route){
  currentMarkers.forEach(m=>map.removeLayer(m));currentMarkers=[];
  if(currentPolyline)map.removeLayer(currentPolyline);
  var latlngs=[];
  route.points.forEach((pt,i)=>{
    var latlng=[pt.lat,pt.lng];latlngs.push(latlng);
    var repaired=isRepaired(pt.id);
    var icon=L.divIcon({
      className:'custom-marker-container',
      html:'<div class="custom-marker'+(repaired?' repaired':'')+'" style="background:'+route.color+'">'+(repaired?'✓':route.emoji)+'</div>',
      iconSize:[32,32],iconAnchor:[16,16]
    });
    var m=L.marker(latlng,{icon}).addTo(map);
    m.on('click',function(){openSidePanel(pt,route);});
    currentMarkers.push(m);
  });
  if(latlngs.length>1){currentPolyline=L.polyline(latlngs,{color:route.color,weight:3,opacity:.6,dashArray:'8,6'}).addTo(map);}
  if(latlngs.length>0){map.fitBounds(L.latLngBounds(latlngs),{padding:[40,40]});}
}

function openGameModal(pointId){
  var pt=findPointById(pointId);if(!pt)return;
  var overlay=document.createElement('div');overlay.className='modal-overlay';overlay.id='gameModal';
  var box=document.createElement('div');box.className='modal-box';
  var gameComplete=false;

  function closeModal(){if(overlay.parentNode)overlay.parentNode.removeChild(overlay);}
  function setBtnDone(){
    var btn=box.querySelector('.modal-btn');if(btn){btn.classList.add('done');btn.textContent='✅ 确认修复';btn.onclick=function(){completeRepair(pointId,pt,overlay);};}
  }

  box.innerHTML=
    '<button class="modal-close" onclick="arguments[0].stopPropagation();var m=document.getElementById(\'gameModal\');if(m)m.parentNode.removeChild(m);">✕</button>'+
    '<h3>'+pt.id+' '+pt.name+'</h3>'+
    '<div class="modal-sub">'+pt.year+' · '+pt.type+' · '+pt.play+'</div>'+
    '<div id="gameContent"></div>'+
    '<button class="modal-btn" disabled>请完成修复任务</button>';

  overlay.appendChild(box);document.body.appendChild(overlay);

  var gc=box.querySelector('#gameContent');
  if(pt.play==='拼图修复'){buildPuzzleGame(gc,pt,setBtnDone);}
  else if(pt.play==='排序修复'){buildSortGame(gc,pt,setBtnDone);}
  else if(pt.play==='语音解谜'){buildVoiceGame(gc,pt,setBtnDone);}
  else{buildCompareGame(gc,pt,setBtnDone);}

  overlay.onclick=function(e){if(e.target===overlay)closeModal();};
  box.querySelector('.modal-close').onclick=closeModal;
}

function completeRepair(pointId,pt,overlay){
  if(isRepaired(pointId))return;
  repairedPoints.push(pointId);saveRepair();
  // success overlay
  var so=document.createElement('div');so.className='success-overlay';
  so.innerHTML='<div class="success-icon">✨</div><div class="success-title">碎片修复成功！</div><div class="success-reward">获得：'+pt.reward+'</div>';
  document.body.appendChild(so);
  setTimeout(function(){if(so.parentNode)so.parentNode.removeChild(so);},2200);
  // close game modal
  if(overlay.parentNode)overlay.parentNode.removeChild(overlay);
  // refresh UI
  setTimeout(function(){
    updateProgress();
    selectRoute(activeRouteIdx);
    updateArchiveBadge();
  },400);
}

/* ---- PUZZLE ---- */
function buildPuzzleGame(gc,pt,setBtnDone){
  var slots=[0,0,0,0]; // which piece placed
  var pieces=['↖️','↗️','↙️','↘️'];
  var shuffled=pieces.slice().sort(function(){return Math.random()-.5;});
  var placedCount=0;
  var html='<div style="text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:8px">拖动下方emoji到正确位置拼合图片</div>';
  html+='<div class="puzzle-grid">';
  for(var i=0;i<4;i++){html+='<div class="puzzle-slot" id="slot'+i+'" ondrop="dropHandler(event)" ondragover="dragOverHandler(event)"></div>';}
  html+='</div><div class="puzzle-pieces">';
  for(var j=0;j<4;j++){html+='<div class="puzzle-piece" id="piece'+j+'" draggable="true" ondragstart="dragStartHandler(event)">'+shuffled[j]+'</div>';}
  html+='</div>';
  gc.innerHTML=html;

  window.dragStartHandler=function(e){e.dataTransfer.setData('text',e.target.id);};
  window.dragOverHandler=function(e){e.preventDefault();};
  window.dropHandler=function(e){
    e.preventDefault();
    var pieceId=e.dataTransfer.getData('text');
    var pieceEl=document.getElementById(pieceId);
    var slotEl=e.target.closest('.puzzle-slot');if(!slotEl)return;
    var slotIdx=parseInt(slotEl.id.replace('slot',''));
    if(slots[slotIdx]!==0)return;
    slots[slotIdx]=parseInt(pieceId.replace('piece',''));
    slotEl.textContent=shuffled[slots[slotIdx]];
    slotEl.classList.add('filled');
    pieceEl.classList.add('placed');
    placedCount++;
    if(placedCount===4){
      var btn=document.querySelector('#gameModal .modal-btn');
      btn.disabled=false;btn.classList.add('active');btn.textContent='🔧 确认修复';
      btn.onclick=function(){setBtnDone();};
    }
  };
}

      {year:'1911年10月11日',desc:'湖北军政府成立'},
      {year:'1912年1月1日',desc:'中华民国成立'}
    ];
  }
  var correctOrder=events.map(function(_,i){return i;});
  var shuffled=events.slice().sort(function(){return Math.random()-.5;});
  var selected=[];
  var html='<div style="text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:8px">按时间先后顺序点击选择</div>';
  html+='<div class="sort-list">';
  shuffled.forEach(function(ev,i){
    html+='<div class="sort-item" id="sortItem'+i+'" onclick="selectSortItem('+i+',\''+ev.year+'\')"><div class="sort-year">📅 年份未知</div><div class="sort-desc">'+ev.desc+'</div></div>';
  });
  html+='</div><div class="sort-pick-order" id="sortOrder">请按时间先后点击...</div>';
  gc.innerHTML=html;
  gc._shuffled=shuffled;gc._events=events;gc._selected=selected;gc._correctOrder=correctOrder;
}

window.selectSortItem=function(idx,yearStr){
  var gc=document.getElementById('gameContent');if(!gc||!gc._shuffled)return;
  var item=document.getElementById('sortItem'+idx);
  if(gc._selected.indexOf(idx)!==-1)return;
  gc._selected.push(idx);
  item.classList.add('selected');
  item.querySelector('.sort-year').textContent='📅 '+yearStr;
  var orderEl=document.getElementById('sortOrder');
  orderEl.textContent='已选顺序：'+gc._selected.map(function(si,i){return (i+1)+'. '+gc._shuffled[si].desc.substring(0,8)+'...';}).join(' → ');
  if(gc._selected.length===3){
    // check order
    var correct=true;
    for(var i=0;i<3;i++){if(gc._selected[i]!==gc._correctOrder[i]){correct=false;break;}}
    if(correct){
      var items=gc.querySelectorAll('.sort-item');
      items.forEach(function(it){it.classList.add('correct');});
      var btn=document.querySelector('#gameModal .modal-btn');
      btn.disabled=false;btn.classList.add('active');btn.textContent='🔧 确认修复';
      btn.onclick=function(){setBtnDone();};
    }else{
      orderEl.textContent='❌ 顺序错误，请重试！';
      var items=gc.querySelectorAll('.sort-item');
      items.forEach(function(it){it.classList.add('wrong');});
      setTimeout(function(){
        items.forEach(function(it){it.classList.remove('selected','wrong');});
        gc._selected=[];orderEl.textContent='请按时间先后点击...';
        items.forEach(function(it,i){it.querySelector('.sort-year').textContent='📅 年份未知';});
      },800);
    }
  }
};

/* ---- VOICE ---- */
function buildVoiceGame(gc,pt,setBtnDone){
  var played=false;
  var question,options,correctAns;
  if(pt.id==='J-13'){
    question='毛泽东在武昌农讲所主要培养的是哪类人才？';
    options=['军事指挥人才','农民运动骨干','工业技术人才'];correctAns=1;
  }else if(pt.id==='J-17'){
    question='"高山流水"故事中，钟子期听出了伯牙琴声中的什么意境？';
    options=['高山和流水','战场和厮杀','田园和牧歌'];correctAns=0;
  }else{
    question='这个历史人物与以下哪个事件有关？';
    options=['选项A','选项B','选项C'];correctAns=0;
  }
  var html='<div class="voice-player">';
  html+='<button class="voice-btn" id="voicePlayBtn" onclick="playVoice()">▶️</button>';
  html+='<div class="voice-status" id="voiceStatus">点击播放历史故事</div></div>';
  html+='<div class="voice-question" id="voiceQuestion" style="display:none">'+question+'</div>';
  html+='<div class="voice-options" id="voiceOptions" style="display:none">';
  options.forEach(function(opt,i){html+='<div class="voice-opt" id="voiceOpt'+i+'" onclick="selectVoiceOpt('+i+','+correctAns+')">'+opt+'</div>';});
  html+='</div>';
  gc.innerHTML=html;
  gc._correctAns=correctAns;
}

window.playVoice=function(){
  var btn=document.getElementById('voicePlayBtn');if(!btn)return;
  btn.classList.add('playing');btn.textContent='⏳';
  document.getElementById('voiceStatus').textContent='正在播放：历史故事...';
  setTimeout(function(){
    btn.classList.remove('playing');btn.textContent='✅';
    document.getElementById('voiceStatus').textContent='播放完成！请回答问题';
    document.getElementById('voiceQuestion').style.display='';
    document.getElementById('voiceOptions').style.display='';
  },3000);
};

window.selectVoiceOpt=function(idx,correctAns){
  var opt=document.getElementById('voiceOpt'+idx);if(!opt)return;
  if(idx===correctAns){
    opt.classList.add('correct');
    var opts=document.querySelectorAll('#gameContent .voice-opt');
    for(var i=0;i<opts.length;i++){opts[i].style.pointerEvents='none';}
    var btn=document.querySelector('#gameModal .modal-btn');
    btn.disabled=false;btn.classList.add('active');btn.textContent='🔧 确认修复';
    btn.onclick=function(){setBtnDone();};
  }else{
    opt.classList.add('wrong');
    setTimeout(function(){opt.classList.remove('wrong');},1000);
  }
};

/* ---- COMPARE ---- */
function buildCompareGame(gc,pt,setBtnDone){
  var dragged=false;
  var html='<div style="text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:8px">拖动中间滑块对比今昔</div>';
  html+='<div class="compare-container" id="compareContainer">';
  html+='<div class="compare-old"><span style="font-size:48px">📷</span><div>老照片</div><div class="compare-label">'+pt.year+'</div></div>';
  html+='<div class="compare-new" id="compareNew"><span style="font-size:48px">📷</span><div>现在</div><div class="compare-label">2024年</div></div>';
  html+='<div class="compare-handle" id="compareHandle"></div></div>';
  gc.innerHTML=html;
  var handle=document.getElementById('compareHandle');
  var container=document.getElementById('compareContainer');
  var newEl=document.getElementById('compareNew');

  function onMove(e){
    var rect=container.getBoundingClientRect();
    var x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
    var pct=Math.max(5,Math.min(95,(x/rect.width)*100));
    handle.style.left=pct+'%';
    newEl.style.clipPath='inset(0 '+(100-pct)+'% 0 0)';
    dragged=true;
  }

  handle.addEventListener('mousedown',function(e){e.preventDefault();window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',function(){window.removeEventListener('mousemove',onMove);if(dragged){var btn=document.querySelector('#gameModal .modal-btn');btn.disabled=false;btn.classList.add('active');btn.textContent='🔧 完成对比，确认修复';btn.onclick=function(){setBtnDone();};}},{once:true});});
  handle.addEventListener('touchstart',function(e){e.preventDefault();window.addEventListener('touchmove',onMove);window.addEventListener('touchend',function(){window.removeEventListener('touchmove',onMove);if(dragged){var btn=document.querySelector('#gameModal .modal-btn');btn.disabled=false;btn.classList.add('active');btn.textContent='🔧 完成对比，确认修复';btn.onclick=function(){setBtnDone();};}},{once:true});});
}

function openArchive(){
  var overlay=document.createElement('div');overlay.className='archive-overlay';overlay.id='archiveOverlay';
  var totalRepaired=getRepairedCount();

  var html='<div class="archive-header"><h3>📚 武汉历史档案</h3><button class="archive-close" onclick="var m=document.getElementById(\'archiveOverlay\');if(m)m.parentNode.removeChild(m);">✕</button></div>';
  html+='<div class="archive-progress">';
  ROUTES.forEach(function(r){
    var rc=0;r.points.forEach(function(p){if(isRepaired(p.id))rc++;});
    html+='<div class="archive-route-progress"><span class="rp-name" style="color:'+r.color+'">'+r.emoji+' '+r.name+'</span><div class="rp-bar"><div class="rp-bar-inner" style="width:'+((rc/r.points.length)*100)+'%;background:'+r.color+'"></div></div><span class="rp-num">'+rc+'/'+r.points.length+'</span></div>';
  });
  html+='</div>';

  // All 25 cards
  var allPoints=[];
  ROUTES.forEach(function(r){r.points.forEach(function(p){allPoints.push({point:p,route:r});});});
  html+='<div class="archive-grid">';
  allPoints.forEach(function(item){
    var p=item.point,r=item.route;var unlocked=isRepaired(p.id);
    html+='<div class="archive-card '+(unlocked?'unlocked':'locked')+'">';
    if(unlocked){
      html+='<div class="arc-icon">✅</div><div class="arc-id">'+p.id+'</div><div class="arc-name">'+p.name+'</div>';
    }else{
      html+='<div class="arc-icon">🔒</div><div class="arc-id">???</div><div class="arc-name">???</div>';
    }
    html+='</div>';
  });
  html+='</div>';

  overlay.innerHTML=html;
  document.body.appendChild(overlay);
  overlay.onclick=function(e){if(e.target===overlay){if(overlay.parentNode)overlay.parentNode.removeChild(overlay);}};
}
